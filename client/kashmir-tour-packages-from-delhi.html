<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashmir Tour Packages from Delhi | 2026 Deals</title>
    <meta name="description" content="Exclusive Kashmir tour packages starting from Delhi. Includes flights, transfers, and luxury stays.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root { --primary: #064e3b; --accent: #f59e0b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .bg-primary-custom { background-color: var(--primary); }
        .text-accent { color: var(--accent); }
        .btn-accent { background-color: var(--accent); color: white; border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">Kashmir<span class="text-accent">Holidays</span></a>
        </div>
    </nav>
    <div class="bg-primary-custom text-white py-5 text-center">
        <h1 class="display-4">Kashmir Packages from Delhi</h1>
        <p class="lead">Seamless Travel from the National Capital.</p>
    </div>
    <main class="container py-5">
        <div class="row g-5">
            <div class="col-lg-8">
                <div class="card mb-5 border-0 shadow-sm rounded-4 overflow-hidden">
                    <img src="assets/cinematic_dal_lake_sunset_landscape.png" class="img-fluid" alt="Delhi to Kashmir">
                    <div class="card-body p-4">
                        <h2 class="h3 fw-bold mb-3">All-Inclusive Delhi Special</h2>
                        <p class="text-muted">Direct flight packages, airport pickups, and premium hospitality tailored for Delhi travelers.</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-0 rounded-4">
                    <h3 class="h4 fw-bold mb-4">Inquire Now</h3>
                    <form action="https://formspree.io/f/info@kashmirholidaypackage.com" method="POST">
                        <input type="hidden" name="package" value="Delhi to Kashmir">
                        <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="Full Name" required></div>
                        <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="Phone Number" required></div>
                        <button type="submit" class="btn btn-accent w-100 py-3 rounded-pill fw-bold">Get Special Offer</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
