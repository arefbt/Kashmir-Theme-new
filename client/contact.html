<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Kashmir Holidays</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } h1, h2, h3 { font-family: 'Playfair+Display', serif; }</style>
</head>
<body class="bg-slate-50">
    <nav class="bg-emerald-900 text-white p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">Kashmir<span class="text-amber-400">Holidays</span></a>
            <div class="space-x-6">
                <a href="index.html" class="hover:text-amber-400 transition">Home</a>
                <a href="packages.html" class="hover:text-amber-400 transition">Packages</a>
                <a href="contact.html" class="text-amber-400 transition">Contact</a>
            </div>
        </div>
    </nav>

    <div class="bg-emerald-800 text-white py-12 text-center">
        <h1 class="text-4xl">Plan Your Trip</h1>
    </div>

    <main class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <div class="space-y-6">
                <h2 class="text-3xl font-bold text-emerald-900">Get in Touch</h2>
                <p class="text-slate-600">Our local travel experts are ready to help you plan your perfect vacation.</p>
                <div class="space-y-4 text-slate-700">
                    <p>📍 Boulevard Road, Srinagar, J&K</p>
                    <p>📞 +91 98765 43210</p>
                    <p>📧 info@kashmirholidaypackage.com</p>
                </div>
            </div>
            
            <div class="bg-white p-8 rounded-xl shadow-lg border border-slate-200">
                <form action="#" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Name</label>
                        <input type="text" class="w-full border border-slate-300 p-2 rounded" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Email</label>
                        <input type="email" class="w-full border border-slate-300 p-2 rounded" placeholder="john@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Message</label>
                        <textarea class="w-full border border-slate-300 p-2 rounded h-32"></textarea>
                    </div>
                    <button type="button" class="w-full bg-amber-500 text-white py-3 rounded-lg font-bold hover:bg-amber-600 transition">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-emerald-950 text-emerald-100 py-8 text-center mt-12">
        <p>&copy; 2026 Kashmir Holiday Packages</p>
    </footer>
</body>
</html>
