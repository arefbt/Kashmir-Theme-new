<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pahalgam Tour Packages | Valley of Shepherds 2026</title>
    <meta name="description" content="Explore Pahalgam with our specialized tour packages. Visit Betaab Valley, Aru Valley, and enjoy riverside luxury.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root { --primary: #064e3b; --accent: #f59e0b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .bg-primary-custom { background-color: var(--primary); }
        .text-accent { color: var(--accent); }
        .btn-accent { background-color: var(--accent); color: white; border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">Kashmir<span class="text-accent">Holidays</span></a>
            <div class="ms-auto">
                <a class="btn btn-accent px-4 rounded-pill" href="contact.html">Book Now</a>
            </div>
        </div>
    </nav>
    <div class="bg-primary-custom text-white py-5 text-center">
        <h1 class="display-4">Pahalgam Tour Packages</h1>
        <p class="lead">Experience the serenity of the Valley of Shepherds.</p>
    </div>
    <main class="container py-5">
        <div class="row g-5">
            <div class="col-lg-8">
                <div class="card mb-5 border-0 shadow-sm rounded-4 overflow-hidden">
                    <img src="assets/lush_pahalgam_valley_landscape.png" class="img-fluid" alt="Pahalgam Valley">
                    <div class="card-body p-4">
                        <h2 class="h3 fw-bold mb-3">Pahalgam Riverside Luxury</h2>
                        <p class="text-muted">Stay by the Lidder River, explore Betaab Valley, and enjoy pony rides to Baisaran Meadow.</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-0 rounded-4">
                    <h3 class="h4 fw-bold mb-4">Book Pahalgam Trip</h3>
                    <form action="https://formspree.io/f/info@kashmirholidaypackage.com" method="POST">
                        <input type="hidden" name="package" value="Pahalgam Package">
                        <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="Full Name" required></div>
                        <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="Phone Number" required></div>
                        <button type="submit" class="btn btn-accent w-100 py-3 rounded-pill fw-bold">Send Inquiry</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
